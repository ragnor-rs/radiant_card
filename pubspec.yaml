name: radiant_card
description: >-
  Holographic trading-card widgets for Flutter. Applies a Phong-shaded fragment
  program to any widget, with gloss that reacts as you drag across the card.
repository: https://github.com/ragnor-rs/radiant_card
issue_tracker: https://github.com/ragnor-rs/radiant_card/issues

version: 0.1.2

topics:
  - shader
  - card
  - animation
  - graphics

environment:
  sdk: ">=2.18.0 <4.0.0"
  flutter: ">=3.7.0"

dependencies:
  flutter:
    sdk: flutter

  vector_math: ^2.1.4

dev_dependencies:

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  shaders:
    - shaders/phong.glsl